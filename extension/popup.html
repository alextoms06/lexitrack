<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LexiTrack</title>
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <div class="brand"><span class="brand-mark">L</span><span>LexiTrack</span></div>
        <span class="word-count" id="word-count">0 words</span>
      </header>
      <label class="search-box" for="word-search">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 4 4"></path></svg>
        <input id="word-search" type="search" placeholder="Search your words" autocomplete="off" />
      </label>
      <p class="status" id="status" role="status">Loading your vocabulary…</p>
      <section class="word-list" id="word-list" aria-live="polite"></section>
      <footer class="popup-footer">Saved only in this browser profile</footer>
    </main>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
